<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a3a5c">
  <title>بنك أسئلة الثقافة المالية | حسين علقم</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body onload="checkExistingUser()">

<div class="app-container">

  <!-- HEADER -->
  <header>
    <span class="header-icon">📚</span>
    <h1>بنك أسئلة مادة الثقافة المالية</h1>
    <p>إعداد المشرف التربوي: <strong>حسين علقم</strong></p>
  </header>

  <div class="content">

    <!-- SCREEN: START -->
    <div id="screen-start" class="screen">
      <div class="welcome-title">🎓 مرحباً بك في منصة الاختبارات الذكية</div>
      <div class="input-group">
        <label>اسم الطالب</label>
        <input type="text" id="student-name" placeholder="أدخل اسمك هنا...">
      </div>
      <div class="input-group">
        <label>اسم المدرسة</label>
        <input type="text" id="student-school" placeholder="أدخل اسم مدرستك...">
      </div>
      <div class="mode-selector">
        <button class="btn-mode active" id="mode-train" onclick="setMode('train')">📖 نمط التدريب</button>
        <button class="btn-mode" id="mode-exam" onclick="setMode('exam')">📝 نمط الامتحان</button>
      </div>
      <button class="btn btn-primary" onclick="saveNewUser()">دخول للبنك ←</button>
    </div>

    <!-- SCREEN: DASHBOARD -->
    <div id="screen-dashboard" class="screen">
      <div class="user-info">
        <span id="user-display"></span>
        <button class="logout-btn" onclick="logout()">تبديل المستخدم</button>
      </div>
      <div id="dash-content"></div>
    </div>

    <!-- SCREEN: QUIZ -->
    <div id="screen-quiz" class="screen">
      <div id="quiz-header"></div>
      <div id="quiz-area"></div>
      <button class="btn-finish" onclick="finishQuiz()">✅ إنهاء الاختبار وعرض النتيجة</button>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="screen-result" class="screen result-view">
      <div id="result-icon"></div>
      <h2>نتيجتك النهائية</h2>
      <div class="score-circle" id="final-score">0%</div>
      <div class="analysis-card" id="analysis-text"></div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="showDashboard()">← اختبار جديد</button>
      </div>
    </div>

  </div>
</div>

<script src="questions.js"></script>

<script src="script.js"></script>
<script src="script.js"></script>
</body>
</html>
